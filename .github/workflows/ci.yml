name: ci
on:
  push:
  pull_request:

jobs:
  node:
    # Supported CI environment for v0.1: Linux x64, Node 24 and 26, Docker Engine + Compose v2+.
    name: test (${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Pre-pull pinned service images
        run: docker compose -f compose.yaml pull
        env:
          KP_RUN_ID: ci-pull
          KP_PG_PASSWORD: ci-pull
      - run: node dist/src/cli.js doctor
      - name: Integration (real Redis, PostgreSQL, SIGKILL, broker redelivery)
        run: node --test --test-concurrency=2 --test-timeout=300000 "dist/tests/integration/**/*.test.js"
      - name: Demo comparison
        run: node dist/src/cli.js demo --compare --quiet
      - name: Packed consumer smoke test (A14)
        run: npm run test:consumer
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: killpoint-runs-node${{ matrix.node }}
          path: .killpoint/
          if-no-files-found: ignore

  test:
    # Branch protection requires a check named "test"; it passes only if every Node version passed.
    needs: node
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.node.result }}" = success
