version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Exact versions are pinned on purpose; each bump must pass the real-infrastructure CI.
    versioning-strategy: increase
    ignore:
      # Typings must match the oldest supported Node runtime (24.x); newer majors describe
      # APIs that runtime does not have (e.g. @types/node 26 made process.disconnect optional).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
