# Disposable per-run test services for killpoint.
# The runner always invokes this with a unique project name (-p kp-<run-id>) and
# KP_RUN_ID / KP_PG_PASSWORD set. Ports bind to loopback with host-allocated
# numbers; the runner discovers them with `docker compose port`.
services:
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1::6379"]
    labels:
      io.killpoint.owner: killpoint
      io.killpoint.run-id: "${KP_RUN_ID:?KP_RUN_ID is required}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 60
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: kp
      POSTGRES_DB: kp
      POSTGRES_PASSWORD: "${KP_PG_PASSWORD:?KP_PG_PASSWORD is required}"
    ports: ["127.0.0.1::5432"]
    # Data lives in the container's tmpfs: only worker processes are crashed in v0.1,
    # never PostgreSQL itself, so committed-and-visible is the durability boundary tested.
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      io.killpoint.owner: killpoint
      io.killpoint.run-id: "${KP_RUN_ID:?KP_RUN_ID is required}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kp -d kp -h 127.0.0.1"]
      interval: 1s
      timeout: 2s
      retries: 60
